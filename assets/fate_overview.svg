<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">FATE method overview</title>
  <desc id="desc">Failure collection flows into repair proposal, verifier scoring, Pareto replay, and policy update.</desc>
  <defs>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="18" fill="#ffffff"/>
  <rect x="42" y="42" width="1116" height="436" rx="18" fill="#fbfaf7" stroke="#d8d8d8"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="600" y="92" text-anchor="middle" font-size="30" font-weight="700" fill="#141414">Failure-Trajectory Evolution</text>
    <text x="600" y="124" text-anchor="middle" font-size="16" fill="#575757">on-policy repair proposal with verifier-filtered Pareto replay</text>

    <g transform="translate(92 190)">
      <rect width="190" height="118" rx="12" fill="#ffffff" stroke="#cfd6df"/>
      <circle cx="42" cy="42" r="18" fill="#dbeafe"/>
      <path d="M34 42h16M42 34v16" stroke="#1f6feb" stroke-width="3" stroke-linecap="round"/>
      <text x="95" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#141414">Collect</text>
      <text x="95" y="68" text-anchor="middle" font-size="14" fill="#575757">failed trajectories</text>
      <text x="95" y="90" text-anchor="middle" font-size="14" fill="#575757">from current policy</text>
    </g>

    <g transform="translate(333 190)">
      <rect width="190" height="118" rx="12" fill="#ffffff" stroke="#cfd6df"/>
      <circle cx="42" cy="42" r="18" fill="#dcfce7"/>
      <path d="M34 47c10-18 21-18 32 0" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
      <text x="95" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#141414">Repair</text>
      <text x="95" y="68" text-anchor="middle" font-size="14" fill="#575757">sample candidates</text>
      <text x="95" y="90" text-anchor="middle" font-size="14" fill="#575757">with same policy</text>
    </g>

    <g transform="translate(574 190)">
      <rect width="190" height="118" rx="12" fill="#ffffff" stroke="#cfd6df"/>
      <circle cx="42" cy="42" r="18" fill="#fef3c7"/>
      <path d="M32 42l8 8 16-18" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="95" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#141414">Score</text>
      <text x="95" y="68" text-anchor="middle" font-size="14" fill="#575757">security, utility</text>
      <text x="95" y="90" text-anchor="middle" font-size="14" fill="#575757">refusal, control</text>
    </g>

    <g transform="translate(815 190)">
      <rect width="190" height="118" rx="12" fill="#ffffff" stroke="#cfd6df"/>
      <circle cx="42" cy="42" r="18" fill="#ede9fe"/>
      <path d="M30 52l12-22 10 15 10-8" fill="none" stroke="#6d28d9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="95" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#141414">Select</text>
      <text x="95" y="68" text-anchor="middle" font-size="14" fill="#575757">Pareto-front</text>
      <text x="95" y="90" text-anchor="middle" font-size="14" fill="#575757">replay targets</text>
    </g>

    <g transform="translate(508 360)">
      <rect width="190" height="82" rx="12" fill="url(#blue)"/>
      <text x="95" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Update Policy</text>
      <text x="95" y="60" text-anchor="middle" font-size="14" fill="#e5f3ff">SFT warmup + PFPO</text>
    </g>

    <path d="M285 249h42" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M526 249h42" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M767 249h42" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M910 314c-50 72-137 89-208 89" fill="none" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M508 403c-210 0-310-49-330-144" fill="none" stroke="#1f2937" stroke-width="2.5" stroke-dasharray="6 8" marker-end="url(#arrow)"/>
  </g>
</svg>
