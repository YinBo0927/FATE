[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fate-reproduction"
version = "0.1.0"
description = "Reproduction scaffold for FATE: On-Policy Self-Evolution via Failure Trajectories."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Reproduction" }]
dependencies = [
  "accelerate>=0.33",
  "datasets>=2.20",
  "numpy>=1.26",
  "pandas>=2.2",
  "peft>=0.12",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "rich>=13.7",
  "torch>=2.3",
  "tqdm>=4.66",
  "transformers>=4.44",
  "trl>=0.9",
]

[project.optional-dependencies]
benchmarks = [
  "agentdojo>=0.1.35",
  "inspect_ai==0.3.25",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

